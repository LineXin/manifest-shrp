# КЛИЕНТСКИЙ СКРИПТ СБОРКИ  ОТ LINEXIN (BLOSSOM)
# ДЛЯ SHRP ТОЛЬКО ДЛЯ BLOSSOM

name: SHRP Сборка для Blossom

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Ссылка на манифест SHRP'
        required: true
        default: 'https://github.com/LineXin/manifest-shrp'
      MANIFEST_BRANCH:
        description: 'Ветка манифеста'
        required: true
        default: 'shrp-12.1'
      DEVICE_TREE_URL:
        description: 'Ссылка на дерево устройства'
        required: true
        default: 'https://github.com/LineXin/recovery_device_xiaomi_blossom'
      DEVICE_TREE_BRANCH:
        description: 'Ветка дерева устройства (укажи свою)'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Путь, куда клонировать дерево'
        required: true
        default: 'device/xiaomi/blossom'
      DEVICE_NAME:
        description: 'Кодовое имя устройства'
        required: true
        default: 'blossom'
      MAKEFILE_NAME:
        description: 'Имя мейкфайла (без .mk)'
        required: true
        default: 'twrp_blossom'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Вывод параметров запуска
      run: |
        echo "::group::Окружение сборки"
        echo "Манифест: ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Дерево: ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Путь дерева: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Устройство: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Мейкфайл: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "::endgroup::"
 
    - name: Проверка репозитория воркфлоу
      uses: actions/checkout@v3

    - name: Очистка места на сервере (Slimhub)
      uses: rokibhasansagar/slimhub_actions@main

    - name: Установка актуальных пакетов (Ubuntu 22.04)
      run: |
        sudo apt update
        sudo apt -y install bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync xsltproc squashfs-tools tree python3 lib32ncurses-dev
    - name: Установка Java (OpenJDK 8)
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Установка утилиты Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Инициализация исходников (Repo Init)
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.email "developer@linexin.org"
        git config --global user.name "LineXin"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd
          
    - name: Синхронизация исходников (Repo Sync)
      run: |
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
      working-directory: workspace
      
    - name: Клонирование твоего дерева устройств
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Выделение Swap-памяти (12 ГБ)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Компиляция SHRP Recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug || lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        mka recoveryimage -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Публикация готовой сборки в Релизы
      uses: softprops/action-gh-release@v1
      with:
        files: | 
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: SHRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Успешная сборка SkyHawk Recovery Project!
          Устройство: ${{ github.event.inputs.DEVICE_NAME }}
          Базовый манифест: ${{ github.event.inputs.MANIFEST_BRANCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
